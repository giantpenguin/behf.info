<div class="umb-forms-editor-text">
    <textarea class="inline-editor fieldset-name"
              select-on-focus
              umb-forms-auto-size
              ng-model="field.settings.Caption"
              placeholder="Write a caption..."
              tabindex="-1"
              autocomplete="off">
	</textarea>

    <textarea class="inline-editor fieldset-description"
              select-on-focus
              umb-forms-auto-size
              ng-model="field.settings.BodyText"
              placeholder="Write a descriptive text..."
              tabindex="-1"
              autocomplete="off">
	</textarea>
</div>
